<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
    .auth { margin: 26px 0; padding: 18px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
    .auth h2 { margin: 0 0 12px; font-size: 20px; }
    .auth form { display: grid; gap: 10px; }
    .auth label { display: grid; gap: 4px; font-size: 15px; color: #bfd0e5; }
    .auth input { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid #51667c; background: #101a28; color: #ecf4ff; }
    .auth button { font: inherit; font-weight: 700; padding: 10px 14px; border-radius: 10px; border: 0; background: #8ad8df; color: #101a28; cursor: pointer; justify-self: start; }
    .auth button:disabled { opacity: .6; cursor: wait; }
    .auth-state { margin: 0 0 12px; font-weight: 700; }
    .auth-state.in { color: #9be7a8; }
    .auth-error { margin: 10px 0 0; color: #ffb4c0; min-height: 1em; }
    [hidden] { display: none !important; }
    .editor { margin: 26px 0 12px; padding: 18px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; display: grid; gap: 10px; }
    .editor h2 { margin: 0; font-size: 20px; }
    .editor input, .editor textarea, li input, li textarea { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid #51667c; background: #101a28; color: #ecf4ff; width: 100%; box-sizing: border-box; }
    .editor textarea, li textarea { min-height: 72px; resize: vertical; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .btn { font: inherit; font-size: 15px; font-weight: 700; padding: 8px 12px; border-radius: 10px; border: 0; background: #8ad8df; color: #101a28; cursor: pointer; }
    .btn.ghost { background: transparent; color: #8ad8df; border: 1px solid #8ad8df; }
    .btn.danger { background: transparent; color: #ffb4c0; border: 1px solid #ffb4c0; }
    .btn:disabled { opacity: .6; cursor: wait; }
    .notes-error { color: #ffb4c0; min-height: 1em; margin: 6px 0 0; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 4단계 로그인해도 내 자료만</div>
    <h1>점령된 자료실</h1>
    <p>가상 메모는 공개 파일에서 빼서 학습용 Supabase 테이블로 옮겼습니다. 로그인한 사용자는 같은 주소의 서버 API로 자기 가상 메모를 추가·수정·삭제할 수 있습니다.</p>
    <div class="notice">옛 공개 커밋과 옛 배포에는 1단계 메모가 남아 있을 수 있습니다. 메모 요청은 로그인 토큰을 서버에서 검사하고, 메모 주인이 본인일 때만 읽기·수정·삭제를 허용합니다.</div>
    <section class="auth" aria-labelledby="auth-title">
      <h2 id="auth-title">로그인</h2>
      <p id="auth-state" class="auth-state" aria-live="polite">로그인 상태를 확인하는 중입니다.</p>
      <form id="login-form" hidden>
        <label>이메일 <input id="login-email" type="email" autocomplete="username" required></label>
        <label>비밀번호 <input id="login-password" type="password" autocomplete="current-password" required></label>
        <button id="login-button" type="submit">로그인</button>
      </form>
      <button id="logout-button" type="button" hidden>로그아웃</button>
      <p id="auth-error" class="auth-error" role="alert"></p>
    </section>
    <form id="note-form" class="editor" hidden>
      <h2>새 가상 메모</h2>
      <input id="note-title" maxlength="200" placeholder="제목" required aria-label="제목">
      <textarea id="note-body" maxlength="5000" placeholder="내용 (실제 개인정보는 쓰지 마세요)" aria-label="내용"></textarea>
      <div class="row"><button class="btn" id="note-add" type="submit">추가</button></div>
    </form>
    <p id="notes-error" class="notes-error" role="alert"></p>
    <ul id="notes" aria-live="polite"><li>로그인 상태를 확인하는 중입니다.</li></ul>
  </main>
  <script type="module">
    // Supabase Auth 이메일·비밀번호 로그인 (공식 SDK). 아래 두 값은 공개용입니다.
    // 서버 전용 키(secret/service_role)는 절대 이 파일에 넣지 마세요.
    const SUPABASE_URL = 'https://jmnqwlnopvadomxdsndu.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_4EeYRi1sTq84w19QHGsKLw_r4Fp8llp';

    const state = document.querySelector('#auth-state');
    const form = document.querySelector('#login-form');
    const email = document.querySelector('#login-email');
    const password = document.querySelector('#login-password');
    const loginButton = document.querySelector('#login-button');
    const logoutButton = document.querySelector('#logout-button');
    const errorBox = document.querySelector('#auth-error');

    const reasons = {
      invalid_credentials: '이메일 또는 비밀번호가 맞지 않습니다.',
      email_not_confirmed: '이메일 인증이 끝나지 않은 계정입니다.',
      user_banned: '사용이 정지된 계정입니다.',
      over_request_rate_limit: '로그인 시도가 너무 많습니다. 잠시 뒤 다시 시도하세요.',
      over_email_send_rate_limit: '요청이 너무 많습니다. 잠시 뒤 다시 시도하세요.',
      validation_failed: '이메일 또는 비밀번호 형식을 확인하세요.',
    };
    const explain = error => {
      const code = error?.code ?? (error?.status ? `HTTP ${error.status}` : 'unknown');
      const reason = reasons[error?.code] ?? error?.message ?? '알 수 없는 오류입니다.';
      return `로그인 실패: ${reason} (${code})`;
    };

    const list = document.querySelector('#notes');
    const noteForm = document.querySelector('#note-form');
    const noteTitle = document.querySelector('#note-title');
    const noteBody = document.querySelector('#note-body');
    const notesError = document.querySelector('#notes-error');
    let currentSession = null;
    const showMessage = text => {
      const item = document.createElement('li');
      item.textContent = text;
      list.replaceChildren(item);
    };
    // 로그인 토큰만 보냅니다. 사용자 번호·역할·소유자는 서버가 토큰에서 직접 확인합니다.
    const api = async (path, options = {}) => {
      if (!currentSession?.access_token) throw new Error('로그인이 필요합니다.');
      const response = await fetch(path, {
        ...options,
        cache: 'no-store',
        headers: { Authorization: `Bearer ${currentSession.access_token}`,
          ...(options.body ? { 'Content-Type': 'application/json' } : {}) },
      });
      if (response.status === 401) throw new Error('로그인 확인에 실패했습니다. 다시 로그인하세요.');
      if (response.status === 404) throw new Error('메모를 찾을 수 없습니다. (HTTP 404)');
      if (!response.ok) {
        const detail = await response.json().catch(() => ({}));
        throw new Error(`요청을 처리하지 못했습니다. (HTTP ${response.status}${detail.error ? `, ${detail.error}` : ''})`);
      }
      return response.status === 204 ? null : response.json();
    };

    const noteItem = note => {
      const item = document.createElement('li');
      const view = () => {
        const title = document.createElement('strong');
        const content = document.createElement('span');
        title.textContent = note.title;
        content.textContent = note.body;
        const row = document.createElement('div');
        row.className = 'row';
        const edit = document.createElement('button');
        edit.className = 'btn ghost'; edit.type = 'button'; edit.textContent = '수정';
        const remove = document.createElement('button');
        remove.className = 'btn danger'; remove.type = 'button'; remove.textContent = '삭제';
        edit.addEventListener('click', editMode);
        remove.addEventListener('click', async () => {
          notesError.textContent = '';
          remove.disabled = true;
          try {
            await api(`/api/notes/${encodeURIComponent(note.id)}`, { method: 'DELETE' });
            await loadNotes();
          } catch (error) {
            notesError.textContent = `삭제 실패: ${error.message}`;
            remove.disabled = false;
          }
        });
        row.append(edit, remove);
        item.replaceChildren(title, content, row);
      };
      const editMode = () => {
        const title = document.createElement('input');
        title.maxLength = 200; title.value = note.title; title.setAttribute('aria-label', '제목 수정');
        const body = document.createElement('textarea');
        body.maxLength = 5000; body.value = note.body; body.setAttribute('aria-label', '내용 수정');
        const row = document.createElement('div');
        row.className = 'row';
        const save = document.createElement('button');
        save.className = 'btn'; save.type = 'button'; save.textContent = '저장';
        const cancel = document.createElement('button');
        cancel.className = 'btn ghost'; cancel.type = 'button'; cancel.textContent = '취소';
        cancel.addEventListener('click', view);
        save.addEventListener('click', async () => {
          notesError.textContent = '';
          if (!title.value.trim()) { notesError.textContent = '수정 실패: 제목을 입력하세요.'; return; }
          save.disabled = true;
          try {
            note = await api(`/api/notes/${encodeURIComponent(note.id)}`, {
              method: 'PUT', body: JSON.stringify({ title: title.value, body: body.value }),
            });
            view();
          } catch (error) {
            notesError.textContent = `수정 실패: ${error.message}`;
            save.disabled = false;
          }
        });
        row.append(save, cancel);
        item.replaceChildren(title, body, row);
        title.focus();
      };
      view();
      return item;
    };

    let notesRequest = 0;
    const loadNotes = async () => {
      const ticket = ++notesRequest;
      notesError.textContent = '';
      if (!currentSession?.access_token) {
        showMessage('로그인하면 메모가 보입니다.');
        return;
      }
      showMessage('메모를 불러오는 중입니다.');
      try {
        const notes = await api('/api/notes');
        if (ticket !== notesRequest) return;
        if (!Array.isArray(notes)) throw new Error('자료 형식이 맞지 않습니다.');
        if (notes.length === 0) showMessage('내 메모가 없습니다. 위에서 새 가상 메모를 추가해 보세요.');
        else list.replaceChildren(...notes.map(noteItem));
      } catch (error) {
        if (ticket === notesRequest) showMessage(error.message);
      }
    };

    noteForm.addEventListener('submit', async event => {
      event.preventDefault();
      notesError.textContent = '';
      const addButton = document.querySelector('#note-add');
      addButton.disabled = true;
      try {
        await api('/api/notes', { method: 'POST', body: JSON.stringify({ title: noteTitle.value, body: noteBody.value }) });
        noteTitle.value = '';
        noteBody.value = '';
        await loadNotes();
      } catch (error) {
        notesError.textContent = `추가 실패: ${error.message}`;
      } finally {
        addButton.disabled = false;
      }
    });

    const render = session => {
      const changedUser = currentSession?.user?.id !== session?.user?.id;
      currentSession = session ?? null;
      noteForm.hidden = !session?.user;
      if (changedUser || !session) loadNotes();
      const signedIn = Boolean(session?.user);
      state.textContent = signedIn ? `로그인됨: ${session.user.email}` : '로그인하지 않음';
      state.classList.toggle('in', signedIn);
      form.hidden = signedIn;
      logoutButton.hidden = !signedIn;
      if (signedIn) password.value = '';
    };

    let supabase;
    try {
      const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/+esm');
      supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
      const { data } = await supabase.auth.getSession();
      render(data.session);
      supabase.auth.onAuthStateChange((_event, session) => render(session));
    } catch {
      state.textContent = '로그인 기능을 불러오지 못했습니다. 새로고침해 주세요.';
      showMessage('로그인하면 메모가 보입니다.');
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (!supabase) return;
      errorBox.textContent = '';
      loginButton.disabled = true;
      try {
        const { error } = await supabase.auth.signInWithPassword({
          email: email.value.trim(),
          password: password.value,
        });
        if (error) errorBox.textContent = explain(error);
      } catch (error) {
        errorBox.textContent = explain(error);
      } finally {
        loginButton.disabled = false;
      }
    });

    logoutButton.addEventListener('click', async () => {
      if (!supabase) return;
      errorBox.textContent = '';
      logoutButton.disabled = true;
      const { error } = await supabase.auth.signOut();
      if (error) errorBox.textContent = `로그아웃 실패: ${error.message}`;
      logoutButton.disabled = false;
    });
  </script>
</body>
</html>
